# Alembic reads the database URL from the app settings (DATABASE_URL), see
# migrations/env.py, so there is no sqlalchemy.url here to keep in sync.
[alembic]
script_location = migrations
# Makes `import app` work when alembic is run from the repository root.
prepend_sys_path = .
path_separator = os
# 0001_initial_schema.py: the numeric prefix keeps files in migration order.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
