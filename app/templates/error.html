{% extends "base.html" %}

{% block title %}{{ title }} · Navbat{% endblock %}

{% block masthead %}
{# The status code printed large in saffron, like a ticket number the
   machine got wrong. #}
<header class="masthead">
    <div class="container error-page">
        <p class="error-code">{{ status_code }}</p>
        <h1 class="sheet-title error-title">{{ title }}</h1>
        <p class="error-lead">{{ lead }}</p>
        <div class="error-actions">
            <a class="btn btn--light" href="/">See the services</a>
        </div>
    </div>
</header>
{% endblock %}
