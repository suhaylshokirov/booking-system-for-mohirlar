name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    # Real PostgreSQL, same major version as docker-compose.yml. Tests never run
    # on SQLite: the double-booking guarantee is a Postgres exclusion constraint.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: navbat
          POSTGRES_PASSWORD: navbat
          POSTGRES_DB: navbat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U navbat -d navbat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://navbat:navbat@localhost:5432/navbat
      TEST_DATABASE_URL: postgresql+psycopg://navbat:navbat@localhost:5432/navbat_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      # The service container only creates `navbat`; docker-compose creates the
      # test database with an init script, so CI creates it here.
      - name: Create test database
        run: psql "postgresql://navbat:navbat@localhost:5432/navbat" -c "CREATE DATABASE navbat_test"

      - name: Test
        run: pytest
