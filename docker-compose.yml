# `docker compose up --build` starts Postgres and the app; nothing else to set up.
# Values below are development defaults and match .env.example. Override any of
# them from your shell or a .env file next to this one.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: navbat
      POSTGRES_PASSWORD: navbat
      POSTGRES_DB: navbat
    ports:
      # Published so pytest and alembic on the host can reach it. If 5432 is
      # already taken on your machine, run with DB_HOST_PORT=5433.
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the navbat_test database on first start of a fresh volume.
      - ./docker/db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navbat -d navbat"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        # Wait until Postgres accepts connections, not merely until its
        # container has started.
        condition: service_healthy
    environment:
      APP_ENV: development
      # Inside the compose network the database host is the service name.
      DATABASE_URL: postgresql+psycopg://navbat:navbat@db:5432/navbat
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@navbat.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-admin-password}
      # Fill a fresh database with the demo barbershop (safe to leave on: the
      # seed never duplicates or overwrites). Set to false for an empty shop.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "8000:8000"
    # Migrate, optionally seed, then serve. A fresh database gets its schema and
    # demo data on `up`, and a failed migration or seed stops the container
    # instead of serving a broken shop.
    command: >
      sh -c 'alembic upgrade head
      && if [ "$$SEED_DEMO_DATA" = "true" ]; then python -m scripts.seed; fi
      && uvicorn app.main:app --host 0.0.0.0 --port 8000' 

volumes:
  pgdata:
